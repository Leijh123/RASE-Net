[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rase-net"
version = "0.1.0"
description = "Rare-organ compensation and anatomical-prior refinement for interactive abdominal segmentation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
rase = "rase.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["rase*"]
